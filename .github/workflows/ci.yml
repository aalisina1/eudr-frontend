name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  issue-link:
    name: PR closes an issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    # Workflow.md: "Every PR closes at least one issue." Without a check this
    # decayed to roughly one PR in four, which is what emptied the board and
    # left the agent queue with no idea what mattered. Escape hatch for the
    # cases Workflow.md already exempts (typo / doc-only): label the PR
    # `no-issue`.
    steps:
      - name: Require a closing keyword (or the no-issue label)
        env:
          # Via env, never inlined into the script — a PR body is untrusted input.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if printf '%s' ",$PR_LABELS," | grep -q ',no-issue,'; then
            echo "Labelled no-issue — skipping the closing-keyword requirement."
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -qiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))[[:space:]]+#[0-9]+'; then
            echo "PR body links an issue."
            exit 0
          fi
          echo "::error::This PR does not close an issue. Add 'Closes #<n>' to the description (file the issue first if it does not exist yet), or label the PR 'no-issue' if it is a typo/doc-only change."
          exit 1

  lint-and-build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (includes type-check)
        run: npm run build

  e2e:
    name: E2E journeys (Playwright + live backend)
    runs-on: ubuntu-latest

    # The UI-workflow gate: every journey in eudr-vault/10-Specs/UI-Workflows/
    # driven in a real browser against a real backend with freshly seeded demo
    # data. The unit suite cannot catch a broken journey — a page can render
    # perfectly and still dead-end.
    #
    # Freshness matters: `seed_demo_data` derives every clearance/certification
    # date from the seed date, so a fixture seeded here is always "today +/- n"
    # and the date-sensitive assertions are deterministic. A stale local DB is
    # the usual reason this suite passes in CI and fails on a laptop — reseed
    # before blaming the specs (see e2e/README.md).

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: eudr_test
          POSTGRES_USER: eudr
          POSTGRES_PASSWORD: eudr_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eudr -d eudr_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgis://eudr:eudr_password@localhost:5432/eudr_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-e2e-secret-key-not-for-production
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v4

      # eudr-app is private, so this needs a PAT with `repo` read scope stored
      # as the EUDR_BACKEND_TOKEN secret. Fail loudly when it is absent: a
      # silently skipped e2e job is the exact failure mode this gate exists to
      # end (see the "green job that ran zero tests" guards in the backend CI).
      - name: Verify the backend checkout token is configured
        env:
          BACKEND_TOKEN: ${{ secrets.EUDR_BACKEND_TOKEN }}
        run: |
          if [ -z "$BACKEND_TOKEN" ]; then
            echo "::error::EUDR_BACKEND_TOKEN is not set. The E2E gate needs to check out the private aalisina1/eudr-app to run a real backend."
            echo "::error::Create a fine-grained PAT with read access to aalisina1/eudr-app and add it as the repository secret EUDR_BACKEND_TOKEN."
            exit 1
          fi

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: aalisina1/eudr-app
          token: ${{ secrets.EUDR_BACKEND_TOKEN }}
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # django.contrib.gis needs the native GDAL/GEOS/PROJ libs.
      - name: Install system dependencies (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev libmagic1

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install --system -r requirements/development.txt

      - name: Migrate and seed the demo fixture
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          # Reference data first — `seed_demo_data` reads Commodity "COCOA" with a
          # hard get() and dies on a genuinely empty database. This is the order
          # `make seed` documents; it is easy to miss because every dev DB already
          # has these rows.
          python manage.py loaddata apps/commodities/fixtures/commodities.json
          python manage.py seed_demo_data

      - name: Start the backend
        working-directory: backend
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            # Any HTTP answer means Django is serving; the API root itself 404s.
            if curl -s -o /dev/null http://localhost:8000/api/v1/; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not start"; cat /tmp/backend.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself and waits for :3000.
      - name: Run the E2E journeys
        run: |
          set -o pipefail
          npx playwright test --reporter=list | tee /tmp/e2e.log
          # A green job that ran zero tests is worse than a red one — the same
          # guard the backend CI applies to its marker-gated suites. Playwright
          # exits 0 when every test is filtered out or skipped.
          grep -qE '[0-9]+ passed' /tmp/e2e.log || {
            echo "::error::the e2e suite reported no passes — no journeys ran"; exit 1; }
          ! grep -qE '[0-9]+ skipped' /tmp/e2e.log || {
            echo "::error::e2e journeys were skipped — a skip here hides a broken flow, fix or delete the test"; exit 1; }

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: tail -100 /tmp/backend.log || true
